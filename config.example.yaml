# 复制到 ~/.arisa/config.yaml
# 登录态 (cookie/token) 不放这里, 用 `arisa-scraper login` 存到 ~/.arisa/state.json
# key 也可以不写在这里, 改用环境变量 ARISA_TMDB_API_KEY / ARISA_AI_API_KEY

defaults:
  output: index+nfo          # index / index+nfo / index+full
  existing_nfo: trust        # trust / merge / ignore / overwrite
  recognize: ai              # ai (默认, AI 为主) / rules+ai (规则失败才问 AI) / rules
  confidence_threshold: 0.85 # 低于这个写进报告, 建议人工确认
  language: zh-CN
  fallback_language: en-US

tmdb:
  api_key: ""                # https://www.themoviedb.org/settings/api, v3 key 或 v4 read token 都行
  # proxy: http://127.0.0.1:7890  # 一般不用: 默认走 api.tmdb.org, 国内能直连

ai:
  provider: deepseek         # none / claude-code (本机 Claude Code) / deepseek / anthropic / openai (OpenAI 兼容, 如 Ollama)
  # model: deepseek-chat     # 不填按 provider 默认: deepseek-chat / claude-opus-5
  api_key: ""
  # base_url: http://127.0.0.1:11434/v1   # provider=openai 时用
  # proxy: http://127.0.0.1:7890          # anthropic 国内要代理, deepseek 不用
  # effort: low                           # 只对 anthropic 生效

rate_limit:
  list_per_sec: 2
  upload_per_sec: 1

scan:
  interval_minutes: 30
  keep_indexes: 5

libraries:
  - path: /电影
    type: movie
  - path: /剧集
    type: tv
  - path: /动漫
    type: tv
    recognize: ai
  # - path: /来自分享
  #   type: auto
  #   output: index          # 不往这个目录里写东西
  #   existing_nfo: merge

# 识别错了在这里修正, 路径可以是目录或文件
overrides: []
#  - path: /电影/沙丘 (1984)
#    type: movie
#    tmdb_id: 841
