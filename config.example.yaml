# 复制到 ~/.arisa/config.yaml
# 登录态 (Cookie) 不放这里, 用 `arisa-scraper login` 或管理网页存到 ~/.arisa/state.json
# TMDB key 也可以不写在这里, 改用环境变量 ARISA_TMDB_API_KEY

defaults:
  output: index+nfo          # index / index+nfo / index+full
  existing_nfo: trust        # trust / merge / ignore / overwrite
  confidence_threshold: 0.97 # auto 自动接受规则匹配的门槛, 低于它的交给 AI
  language: zh-CN
  fallback_language: en-US

tmdb:
  api_key: ""                # https://www.themoviedb.org/settings/api, v3 key 或 v4 read token 都行
  # proxy: http://127.0.0.1:7890  # 一般不用: 默认走 api.tmdb.org, 国内能直连

bangumi:
  # proxy: http://127.0.0.1:7890  # api.bgm.tv 在国内可能被 DNS 污染, 直连不通时配上

# 常驻服务里自动识别用的 AI: DeepSeek
# 没填 api_key 时不启用 AI, 认不出的都放进待确认
agent:
  enabled: true
  api_key: ""                # https://platform.deepseek.com/api_keys, 也可以用环境变量 ARISA_DEEPSEEK_API_KEY
  model: deepseek-chat
  batch_size: 20             # 一次交给 AI 的作品数
  timeout_minutes: 30

serve:
  port: 7893
  poll_seconds: 90           # 多久看一次夸克的「最近」, 同时给登录续期
  full_scan_hour: 4          # 每天几点全量重扫

rate_limit:
  list_per_sec: 2
  upload_per_sec: 1

scan:
  keep_indexes: 5            # 网盘里保留几个历史索引

libraries:
  - path: /电影
    type: movie
  - path: /剧集
    type: tv
  # - path: /来自分享
  #   type: auto
  #   output: index          # 不往这个目录里写东西
  #   existing_nfo: merge
