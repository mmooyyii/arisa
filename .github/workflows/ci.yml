name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scraper/go.mod
          cache-dependency-path: scraper/go.sum
      - name: 刮削器测试
        working-directory: scraper
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::代码没有 gofmt"; exit 1; }
          go vet ./...
          go test ./...
      - name: 刮削器打包
        run: sh scraper/packaging/package.sh
      - name: App 测试 + 编译
        run: ./gradlew test :app:assembleDebug --stacktrace

  # 打 v1.2.3 标签时发版: 刮削器 zip + TV App apk + latest.json.
  # 刮削器会自动更新到这里的最新版, TV App 由刮削器转存到网盘后在 TV 上手动更新.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 正式签名证书的 SHA-256, 防止用错 keystore 发出没法覆盖安装的包
      EXPECTED_CERT: efdcf6b09f6acf58eeab051b07b4a844a988b3ef2dfadde22a272ef936d29519
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scraper/go.mod
          cache-dependency-path: scraper/go.sum

      - name: 版本号和签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ARISA_KEYSTORE_BASE64 }}
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::缺少 secret ARISA_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ARISA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 打包
        env:
          ARISA_KEYSTORE_PASSWORD: ${{ secrets.ARISA_KEYSTORE_PASSWORD }}
        run: |
          sh scraper/packaging/package.sh "$VERSION"
          ./gradlew :app:assembleRelease -Parisa.version="$VERSION" --stacktrace

      - name: 检查签名
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cert=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "证书 $cert"
          [ "$cert" = "$EXPECTED_CERT" ] || { echo "::error::签名证书不对"; exit 1; }

      - name: 清单和更新说明
        run: |
          mkdir dist
          cp scraper/build/arisa-scraper.zip "dist/arisa-scraper-$VERSION.zip"
          cp app/build/outputs/apk/release/app-release.apk "dist/arisa-$VERSION.apk"
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+$prev..}HEAD > notes.md
          python3 tools/release_manifest.py "$VERSION" "dist/arisa-scraper-$VERSION.zip" "dist/arisa-$VERSION.apk" notes.md > dist/latest.json
          cat dist/latest.json

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
